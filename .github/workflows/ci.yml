name: CI

on:
  pull_request:
  push:
    branches: [main, pre-prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  # Testy databáze (M3): migrace, izolace dat a test izolace migrací (nic mimo schéma se_vezmou se nesmí změnit)
  # na skutečném PostgreSQL 16, bez Dockeru a Supabase CLI. Skript scripts/db-test.sh použije službu postgres
  # přes DATABASE_URL; DB_TEST_ALLOW_RESET potvrzuje, že jde o jednorázovou databázi, jejíž schémata může
  # skript smazat. Druhý krok testuje nástroj `npm run db:migrate` (scripts/db-migrate-test.sh).
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DB_TEST_ALLOW_RESET: "1"
      MIGRATE_TEST_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # nástroj db:migrate potřebuje node a pg
      - run: npm ci
      # klient psql bývá na runneru předinstalovaný; kdyby chyběl, doinstalujeme ho
      - run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: npm run db:test
      - run: npm run db:migrate:test

  e2e:
    # E2E a přístupnost (Playwright + axe) proti produkčnímu sestavení, ADR 0004. Testy přihlášení (M4)
    # běží proti skutečnému PostgreSQL 16 (service container) s aplikovanými migracemi; e-maily se v testech
    # zapisují do souborů místo odeslání. Aplikace mluví s Postgresem přímo přes pg jako role se_vezmou_app
    # (ne superuživatel), jako v produkci; scripts/e2e-db.sh připraví databázi (shim Supabase, init skripty
    # a migrace aplikované vlastníkem) a spustí příkaz.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_DB_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - run: npx playwright install --with-deps chromium
      # Skript připraví databázi, konfigurace Playwrightu sestaví aplikaci (`npm run build`), spustí `next start`
      # a spustí oba projekty (e2e, a11y).
      - run: bash scripts/e2e-db.sh run -- npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
